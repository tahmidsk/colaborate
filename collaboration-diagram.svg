<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
    Collaboration Workflow
  </text>
  
  <!-- Central Repository Circle -->
  <circle cx="200" cy="150" r="50" fill="#4CAF50" stroke="#2E7D32" stroke-width="3"/>
  <text x="200" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    Repository
  </text>
  
  <!-- Contributor 1 -->
  <circle cx="80" cy="80" r="30" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
  <text x="80" y="85" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Dev 1
  </text>
  
  <!-- Contributor 2 -->
  <circle cx="320" cy="80" r="30" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
  <text x="320" y="85" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Dev 2
  </text>
  
  <!-- Contributor 3 -->
  <circle cx="80" cy="220" r="30" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
  <text x="80" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Dev 3
  </text>
  
  <!-- Contributor 4 -->
  <circle cx="320" cy="220" r="30" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
  <text x="320" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Dev 4
  </text>
  
  <!-- Arrows from contributors to repository -->
  <line x1="105" y1="95" x2="165" y2="125" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="295" y1="95" x2="235" y2="125" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="105" y1="205" x2="165" y2="175" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="295" y1="205" x2="235" y2="175" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FF9800"/>
    </marker>
  </defs>
  
  <!-- Labels -->
  <text x="120" y="110" font-family="Arial, sans-serif" font-size="10" fill="#666">
    Push/Pull
  </text>
  <text x="260" y="110" font-family="Arial, sans-serif" font-size="10" fill="#666">
    Push/Pull
  </text>
  <text x="120" y="190" font-family="Arial, sans-serif" font-size="10" fill="#666">
    Push/Pull
  </text>
  <text x="260" y="190" font-family="Arial, sans-serif" font-size="10" fill="#666">
    Push/Pull
  </text>
</svg>
